<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starry Ocean Map â Protein Discovery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #2d3436;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero {
      background: #ffffff;
      border-bottom: 1px solid #eceef1;
      padding: 40px 30px 28px;
      text-align: center;
    }
    .hero h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: 0.5px;
    }
    .hero p {
      font-size: 14px;
      color: #636e72;
      margin-top: 8px;
      font-weight: 400;
    }
    .hero-divider {
      width: 40px;
      height: 2px;
      background: #e74c3c;
      margin: 14px auto 0;
      border-radius: 1px;
    }

    .search-section {
      background: #fafbfc;
      padding: 24px 30px 18px;
      border-bottom: 1px solid #eceef1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      max-width: 560px;
      width: 100%;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #2d3436;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: #e74c3c; }
    .search-bar input::placeholder { color: #a0a0a0; }
    .search-bar button {
      padding: 10px 22px;
      border-radius: 6px;
      border: none;
      background: #e74c3c;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-bar button:hover { background: #c0392b; }
    .search-bar .reset-btn {
      background: #ffffff;
      color: #636e72;
      border: 1px solid #d1d5db;
    }
    .search-bar .reset-btn:hover { background: #f5f5f5; color: #2d3436; }

    /* ===== Field Navigation (Horizontal Scroll) ===== */
    .field-nav-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }
    .field-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 4px 2px;
      width: 100%;
    }
    .field-nav::-webkit-scrollbar { display: none; }
    .nav-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #636e72;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      user-select: none;
    }
    .nav-arrow:hover { border-color: #e74c3c; color: #e74c3c; }

    .field-tab {
      padding: 8px 16px;
      border-radius: 16px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #636e72;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .field-tab:hover { border-color: #e74c3c; color: #e74c3c; }
    .field-tab.active {
      border-color: #e74c3c;
      background: #fdf2f2;
      color: #e74c3c;
      font-weight: 600;
    }

    /* ===== Level-1 Indications ===== */
    .l1-section {
      display: none;
      animation: fadeIn 0.25s ease;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 0 8px;
    }
    .l1-section.active { display: block; }
    .l1-label {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .l1-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .l1-tab {
      padding: 6px 14px;
      border-radius: 14px;
      border: 1px solid #e0e0e0;
      background: #ffffff;
      color: #888888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .l1-tab:hover { border-color: #e74c3c; color: #e74c3c; }
    .l1-tab.active {
      border-color: #e74c3c;
      background: #fdf2f2;
      color: #e74c3c;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Constellation Area ===== */
    .constellation-area {
      position: relative;
      min-height: 380px;
      background: #ffffff;
      overflow: hidden;
      padding: 24px 30px;
      border-bottom: 1px solid #eceef1;
    }
    .constellation-label {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .constellation-label::before,
    .constellation-label::after {
      content: "";
      display: block;
      width: 40px;
      height: 1px;
      background: #e0e0e0;
    }
    .constellation-canvas {
      position: relative;
      min-height: 300px;
    }

    .molecule-node {
      position: absolute;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      user-select: none;
      letter-spacing: 0.2px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #555555;
      z-index: 2;
    }
    .molecule-node:hover {
      border-color: #e74c3c;
      color: #e74c3c;
      transform: scale(1.08);
      z-index: 10;
      box-shadow: 0 2px 8px rgba(231,76,60,0.12);
    }
    .molecule-node.active-node {
      border-color: #e74c3c;
      background: #fdf2f2;
      color: #e74c3c;
    }

    .constellation-line {
      position: absolute;
      height: 1px;
      background: #e0e0e0;
      transform-origin: left center;
      pointer-events: none;
      transition: all 0.4s ease;
      z-index: 1;
    }

    /* ===== Ocean Area ===== */
    .ocean-area {
      position: relative;
      min-height: 200px;
      background: #ffffff;
      overflow: hidden;
      padding: 20px 30px 30px;
    }
    .ocean-label {
      font-size: 10px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
      font-weight: 500;
      text-align: center;
    }
    .ocean-canvas {
      position: relative;
      min-height: 160px;
    }
    .ocean-dot {
      position: absolute;
      border-radius: 50%;
      opacity: 0.7;
      transition: transform 0.3s ease;
    }
    .ocean-dot:hover {
      transform: scale(1.5);
      opacity: 1;
      z-index: 5;
    }

    .empty-hint {
      text-align: center;
      color: #b0b0b0;
      font-size: 13px;
      padding: 40px 0;
    }
  </style>
</head>

    <div class="ocean-label">Molecule Ocean â All Fields</div>

  </div>

const FIELD_LIST = ["Hormonal Disorders","Respiratory","Mouth and Dental Disorders","Ophthalmology","Central Nervous System","Other Diseases","Ear Nose Throat Disorders","Gastrointestinal","Non Malignant Disorders","Metabolic Disorders","Dermatology","Infectious Disease","Genetic Disorders","Musculoskeletal Disorders","Immunology","Hematological Disorders","Toxicology","Nutritional Disorders","Undisclosed","Oncology","Genito Urinary System","Cardiovascular","Women's Health"];
const FIELD_COLORS = {};
FIELD_LIST.forEach((f, i) => {
  const hue = Math.round((i / FIELD_LIST.length) * 360);
  FIELD_COLORS[f] = `hsl(${hue}, 70%, 55%)`;
});

let currentField = null;
let currentL1 = null;

function init() {
  renderFields();
  renderOcean();
  // Auto-select first field
  if (FIELD_LIST.length > 0) {
    selectField(FIELD_LIST[0]);
  }
}

function renderFields() {
  const nav = document.getElementById('fieldNav');
  nav.innerHTML = '';
  FIELD_LIST.forEach(field => {
    const btn = document.createElement('div');
    btn.className = 'field-tab';
    btn.textContent = field;
    btn.dataset.field = field;
    btn.onclick = () => selectField(field);
    nav.appendChild(btn);
  });
}

function scrollNav(dir) {
  const nav = document.getElementById('fieldNav');
  nav.scrollBy({ left: dir * 200, behavior: 'smooth' });
}

function selectField(field) {
  currentField = field;
  currentL1 = null;

  // Update tabs
  document.querySelectorAll('.field-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.field === field);
  });

  const data = HIERARCHY[field];
  const l1List = data && data.children ? data.children : [];

  // Render L1 grid
  const l1Section = document.getElementById('l1Section');
  const l1Grid = document.getElementById('l1Grid');
  const l1Label = document.getElementById('l1Label');
  l1Grid.innerHTML = '';

  if (l1List.length > 0) {
    l1Section.classList.add('active');
    l1Label.textContent = field + ' â Primary Indications (' + l1List.length + ')';

    const allBtn = document.createElement('div');
    allBtn.className = 'l1-tab active';
    allBtn.textContent = 'View All';
    allBtn.onclick = () => { currentL1 = null; renderL1Tabs(); renderConstellationForField(); };
    l1Grid.appendChild(allBtn);

    l1List.forEach(item => {
      const btn = document.createElement('div');
      btn.className = 'l1-tab';
      btn.textContent = item.name;
      btn.dataset.l1 = item.name;
      btn.onclick = () => selectL1(item.name);
      l1Grid.appendChild(btn);
    });
  } else {
    l1Section.classList.remove('active');
  }

  renderConstellationForField();
}

function selectL1(l1Name) {
  currentL1 = l1Name;
  renderL1Tabs();
  renderConstellationForL1();
}

function renderL1Tabs() {
  document.querySelectorAll('.l1-tab').forEach(tab => {
    if (tab.dataset.l1) {
      tab.classList.toggle('active', tab.dataset.l1 === currentL1);
    } else {
      tab.classList.toggle('active', currentL1 === null);
    }
  });
}

function renderConstellationForField() {
  const label = document.getElementById('constellationLabel');
  const canvas = document.getElementById('constellationCanvas');
  label.textContent = currentField + ' â All Indications';

  const data = HIERARCHY[currentField];
  const nodes = (data && data.children ? data.children : []).map(c => c.name);
  renderConstellation(nodes, label.textContent);
}

function renderConstellationForL1() {
  const label = document.getElementById('constellationLabel');
  const data = HIERARCHY[currentField];
  const l1Item = (data && data.children ? data.children : []).find(c => c.name === currentL1);

  if (!l1Item || !l1Item.children || l1Item.children.length === 0) {
    label.textContent = currentField + ' â ' + currentL1 + ' (No sub-indications)';
    renderConstellation([], label.textContent);
    return;
  }

  label.textContent = currentField + ' â ' + currentL1 + ' (' + l1Item.children.length + ' sub-indications)';
  const nodes = l1Item.children.map(c => c.name);
  renderConstellation(nodes, label.textContent);
}

function renderConstellation(nodeNames, labelText) {
  const canvas = document.getElementById('constellationCanvas');
  canvas.innerHTML = '';

  if (nodeNames.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'No nodes to display';
    canvas.appendChild(hint);
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const centerX = rect.width > 0 ? rect.width / 2 : 400;
  const centerY = 150;

  const positions = [];
  nodeNames.forEach((name, i) => {
    const angle = i * 2.4;
    const radius = 28 + i * 10;
    const x = centerX + radius * Math.cos(angle);
    const y = centerY + radius * Math.sin(angle) * 0.7;
    positions.push({ x, y, name });
  });

  // Draw lines first (so they appear behind nodes)
  for (let i = 0; i < positions.length; i++) {
    for (let j = i + 1; j < positions.length; j++) {
      const a = positions[i];
      const b = positions[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 130) {
        const line = document.createElement('div');
        line.className = 'constellation-line';
        line.style.left = a.x + 'px';
        line.style.top = a.y + 'px';
        line.style.width = dist + 'px';
        line.style.transform = 'rotate(' + Math.atan2(dy, dx) + 'rad)';
        canvas.appendChild(line);
      }
    }
  }

  // Draw nodes
  positions.forEach((pos, i) => {
    const node = document.createElement('div');
    node.className = 'molecule-node';
    node.textContent = pos.name;
    node.style.left = (pos.x) + 'px';
    node.style.top = (pos.y) + 'px';
    node.style.transform = 'translate(-50%, -50%)';
    // Staggered fade-in
    node.style.opacity = '0';
    node.style.animation = 'fadeIn 0.4s ease ' + (i * 0.03) + 's forwards';
    canvas.appendChild(node);
  });
}

function renderOcean() {
  const canvas = document.getElementById('oceanCanvas');
  canvas.innerHTML = '';

  const width = canvas.offsetWidth || 900;
  const height = 160;
  const dotSize = 6;

  FIELD_LIST.forEach((field, idx) => {
    const color = FIELD_COLORS[field];
    // Number of dots proportional to total nodes in this field
    const fieldData = HIERARCHY[field];
    let count = 3;
    if (fieldData && fieldData.children) {
      count = Math.max(3, Math.min(18, Math.round(fieldData.children.length / 2)));
    }

    for (let i = 0; i < count; i++) {
      const dot = document.createElement('div');
      dot.className = 'ocean-dot';
      dot.style.width = dotSize + 'px';
      dot.style.height = dotSize + 'px';
      dot.style.background = color;
      const left = (idx / FIELD_LIST.length) * width + (Math.random() * (width / FIELD_LIST.length - 10));
      const top = Math.random() * (height - dotSize);
      dot.style.left = Math.max(0, Math.min(width - dotSize, left)) + 'px';
      dot.style.top = top + 'px';
      dot.title = field;
      canvas.appendChild(dot);
    }
  });
}

function handleSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;

  // Find matching field or L1
  for (const field of FIELD_LIST) {
    if (field.toLowerCase().includes(query)) {
      selectField(field);
      document.getElementById('searchInput').value = '';
      return;
    }
    const data = HIERARCHY[field];
    if (data && data.children) {
      for (const child of data.children) {
        if (child.name.toLowerCase().includes(query)) {
          selectField(field);
          selectL1(child.name);
          document.getElementById('searchInput').value = '';
          return;
        }
      }
    }
  }
  alert('No matching field or indication found.');
}

function resetAll() {
  document.getElementById('searchInput').value = '';
  if (FIELD_LIST.length > 0) {
    selectField(FIELD_LIST[0]);
  }
}

window.addEventListener('resize', () => {
  if (currentField && !currentL1) {
    renderConstellationForField();
  } else if (currentField && currentL1) {
    renderConstellationForL1();
  }
});

init();
</script>
